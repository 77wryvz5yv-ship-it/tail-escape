<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><title>BLOCK ESCAPE v3</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}html,body{margin:0;height:100%;overflow:hidden;background:#06122e;font-family:Arial,sans-serif}button{touch-action:manipulation}
#app{width:min(100vw,520px);height:100dvh;margin:auto;position:relative;overflow:hidden;background:#071b4e;color:#fff}
#cover{position:absolute;inset:0;z-index:99;background:center/cover no-repeat}#start{position:absolute;left:24%;right:24%;bottom:10%;height:13%;border:0;background:transparent}
#game{display:none;height:100%;position:relative;background:#061a4b}
#hud{height:72px;display:grid;grid-template-columns:1fr 1.15fr 1fr 56px;gap:5px;padding:5px;background:#08142c;position:relative;z-index:30}
.h{background:#281a19;border:3px solid #895a2f;border-radius:14px;text-align:center;font-weight:900;padding:4px 2px;font-size:12px}.v{font-size:19px;color:#ffd34e;margin-top:3px}.heart{font-size:20px;color:#ff5667}
#pause{border:3px solid #d68d19;border-radius:13px;background:#ffb72e;color:#fff;font-size:25px;font-weight:900}
#arena{position:absolute;top:72px;bottom:116px;left:0;right:0;overflow:hidden;border-left:12px solid #59402e;border-right:12px solid #59402e;background:radial-gradient(circle at 29% 43%,#fff2a5 0 35px,transparent 37px),linear-gradient(#061c5e,#123f82 67%,#081d48)}
#arena:before{content:"";position:absolute;inset:0;opacity:.45;background-image:radial-gradient(#fff 1px,transparent 2px);background-size:82px 91px;pointer-events:none}
.city{position:absolute;left:0;right:0;bottom:0;height:27%;opacity:.65;background:linear-gradient(155deg,transparent 35%,#071536 36% 100%);clip-path:polygon(0 55%,7% 42%,12% 59%,18% 30%,23% 60%,30% 45%,37% 62%,44% 34%,51% 60%,59% 41%,66% 58%,74% 29%,81% 57%,90% 38%,100% 56%,100% 100%,0 100%)}
#exit{position:absolute;right:2px;top:28px;width:62px;height:84px;z-index:10;border:5px solid #ffcb43;border-radius:26px 26px 8px 8px;background:linear-gradient(90deg,#8f4c1d,#ffd64e,#8f4c1d);box-shadow:0 0 19px #ffce48;text-align:center;padding-top:31px;font-size:25px}#exit b{position:absolute;top:-28px;right:-4px;background:#553018;border:3px solid #ffc73b;border-radius:7px;padding:2px 5px;font-size:17px}
.block{position:absolute;border-radius:7px;border:2px solid rgba(255,255,255,.55);box-shadow:inset 0 4px rgba(255,255,255,.2),inset 0 -5px rgba(0,0,0,.14);z-index:5}.block:after{content:"🐾";position:absolute;inset:0;display:flex;justify-content:center;align-items:center;opacity:.14;font-size:18px}
#dog{position:absolute;z-index:15;width:46px;height:46px;display:flex;align-items:center;justify-content:center;font-size:39px;filter:drop-shadow(0 3px 2px #000);transition:left .08s linear}
.spike{position:absolute;z-index:9;text-align:center;font-size:27px;line-height:32px;color:#f4f4f4;text-shadow:0 2px 2px #111}
#controls{position:absolute;bottom:0;left:0;right:0;height:116px;padding:8px;display:grid;grid-template-columns:1fr 1fr 1.28fr;gap:8px;background:#091631}
.ctrl{border:3px solid rgba(255,255,255,.35);border-radius:28px;color:white;font-weight:900;box-shadow:inset 0 -7px rgba(0,0,0,.16)}.lr{background:linear-gradient(#27a6ff,#1764e5);font-size:34px}.jp{background:linear-gradient(#ffcc47,#f29424);font-size:21px}
#msg{display:none;position:absolute;z-index:50;left:10%;right:10%;top:40%;background:#fff;color:#142248;border-radius:20px;padding:22px;text-align:center;font-size:21px;font-weight:900}

<div id="game"><div id="hud"><div class="h">점수<div class="v" id="score">0</div></div><div class="h">레벨 <span class="v" id="level">1 / 30</span><div id="bar">▰▱▱▱▱</div></div><div class="h">에너지<div id="hp" class="heart">♥♥♥</div></div><button id="pause">Ⅱ</button></div>
<div id="arena"><div class="city"></div><div id="exit"><b>EXIT</b>🐾</div><div id="dog">🐶</div><div id="msg"></div></div>
<div id="controls"><button id="left" class="ctrl lr">◀</button><button id="right" class="ctrl lr">▶</button><button id="jump" class="ctrl jp">🐾 점프</button></div></div></div>
<script>
const A=document.getElementById('arena'),D=document.getElementById('dog'),M=document.getElementById('msg');
const COL=8, colors=['#188fff','#ff5054','#ffc32d','#19c95b']; let W,H,S;
let blocks=[],fall=[],spikes=[],px=1,py=1,baseY=1,jumping=false,jumpStart=0,jumpCells=0,jumpT=0,lastTap=0;
let score=0,level=1,hp=3,running=false,paused=false,lastFrame=0,spawnClock=0,audio=null,musicTimer=null,invuln=0;
function size(){W=A.clientWidth;H=A.clientHeight;S=Math.floor(W/COL)}
function supportAt(c){let h=0;for(const b of blocks)if(c>=b.x&&c<b.x+b.n)h=Math.max(h,b.y+1);return h}
function add(x,y,n,c){blocks.push({x,y,n,c})}
function rect(el,x,y,w,h,c){el.style.left=x+'px';el.style.bottom=y+'px';el.style.width=w+'px';el.style.height=h+'px';if(c)el.style.background=c}
function render(){A.querySelectorAll('.block,.spike').forEach(e=>e.remove());
 for(const b of blocks){let e=document.createElement('div');e.className='block';rect(e,b.x*S,b.y*S,b.n*S,S,b.c);A.appendChild(e)}
 for(const f of fall){let e=document.createElement('div');e.className='block';e.style.left=f.x*S+'px';e.style.top=f.top+'px';e.style.width=f.n*S+'px';e.style.height=S+'px';e.style.background=f.c;A.appendChild(e)}
 for(const s of spikes){let e=document.createElement('div');e.className='spike';e.textContent='▲▲';rect(e,s.x*S,s.y*S,S,S);A.appendChild(e)}
 rect(D,px*S+(S-46)/2,py*S,46,46)
}
function hud(){document.getElementById('score').textContent=score;document.getElementById('level').textContent=level+' / 30';document.getElementById('hp').textContent='♥'.repeat(Math.max(0,hp))+'♡'.repeat(3-Math.max(0,hp));let q=Math.min(5,Math.ceil((score%300)/60));document.getElementById('bar').textContent='▰'.repeat(q)+'▱'.repeat(5-q)}
function resetLevel(){size();blocks=[];fall=[];spikes=[];px=1;py=0;baseY=0;jumping=false;spawnClock=0;invuln=0;
 // Only a low starting landscape. Everything else must actually fall and stack.
 add(0,0,2,colors[0]);add(2,0,1,colors[2]);add(5,0,1,colors[1]);py=supportAt(px);baseY=py;render();hud()}
function tone(f,d=.07,v=.05){if(!audio)return;let o=audio.createOscillator(),g=audio.createGain();o.type='square';o.frequency.value=f;o.connect(g);g.connect(audio.destination);g.gain.setValueAtTime(v,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.start();o.stop(audio.currentTime+d)}
function startAudio(){if(audio)return;audio=new(window.AudioContext||window.webkitAudioContext)();let melody=[330,392,494,659,494,392,349,440,523,698,523,440],i=0;musicTimer=setInterval(()=>{if(running&&!paused)tone(melody[i++%melody.length],.10,.025)},160)}
function damage(){if(invuln>0)return;invuln=900;hp--;tone(100,.22,.08);hud();if(hp<=0)finish('게임 오버!')}
function spawn(){let max=level<5?1:level<12?2:3;let n=1+Math.floor(Math.random()*max),x=Math.floor(Math.random()*(COL-n));fall.push({x,n,top:-S,c:colors[Math.floor(Math.random()*4)]});
 if(level>=5&&Math.random()<Math.min(.09,.025+level*.0015)){let sx=Math.floor(Math.random()*COL),sy=supportAt(sx);spikes.push({x:sx,y:sy})}}
function settle(f){let y=0;for(let c=f.x;c<f.x+f.n;c++)y=Math.max(y,supportAt(c));
 // falling block striking the dog
 let dogCol=Math.floor(px), dogBottom=py*S, blockBottom=y*S;
 if(dogCol>=f.x&&dogCol<f.x+f.n && Math.abs(dogBottom-blockBottom)<S*1.3)damage();
 add(f.x,y,f.n,f.c);
 // Any block covering a spike destroys it.
 spikes=spikes.filter(s=>!(s.x>=f.x&&s.x<f.x+f.n&&s.y===y));
 score+=20;let nl=Math.min(30,1+Math.floor(score/300));level=nl;hud()}
function canMove(nx){let h=supportAt(nx);return h<=py+2}
function move(d){if(!running||paused)return;let nx=Math.max(0,Math.min(COL-1,Math.round(px)+d));if(canMove(nx)){px=nx;if(!jumping){py=supportAt(px);baseY=py}tone(250,.025,.02);render();exitCheck()}}
function jump(){
 if(!running||paused)return;let now=performance.now();
 if(!jumping){jumping=true;baseY=supportAt(px);jumpStart=baseY;jumpCells=1;jumpT=0;lastTap=now;tone(560,.08,.06);return}
 // Only a quick second tap near takeoff may upgrade to two cells. No third jump and no aerial boosting.
 if(jumpCells===1 && now-lastTap<=260 && jumpT<0.32){jumpCells=2;tone(720,.07,.05)}
}
function updateJump(dt){if(!jumping){py=supportAt(px);return}jumpT+=dt/1000;let duration=jumpCells===2?.66:.52;let u=Math.min(1,jumpT/duration);let height=jumpCells*S;let lift=4*height*u*(1-u)/S;py=jumpStart+lift;
 let floor=supportAt(px);if(u>=1||py<=floor){py=floor;jumping=false;jumpCells=0;baseY=py}}
function exitCheck(){let exCol=COL-1;let need=(H-125)/S;if(px>=exCol-1&&py>=need){if(level>=30)finish('🏆 30레벨 완전 탈출!');else{tone(880,.15,.07);level++;score=Math.max(score,(level-1)*300);hud();M.style.display='block';M.textContent='🎉 LEVEL '+(level-1)+' CLEAR!';setTimeout(()=>{M.style.display='none';resetLevel()},700)}}}
function finish(t){running=false;M.style.display='block';M.textContent=t+'  — 터치해서 다시 시작';M.onclick=()=>{M.style.display='none';score=0;level=1;hp=3;resetLevel();running=true}}
function frame(t){let dt=Math.min(32,t-lastFrame||16);lastFrame=t;if(running&&!paused){if(invuln>0)invuln-=dt;spawnClock+=dt;let interval=Math.max(520,1550-level*30);if(spawnClock>=interval){spawnClock=0;spawn()}
 let speed=.055+level*.0035;for(let i=fall.length-1;i>=0;i--){let f=fall[i];f.top+=speed*dt;let y=0;for(let c=f.x;c<f.x+f.n;c++)y=Math.max(y,supportAt(c));let stop=H-(y+1)*S;if(f.top>=stop){settle(f);fall.splice(i,1)}}
 updateJump(dt);
 // spike contact
 let dc=Math.floor(px);if(!jumping&&spikes.some(s=>s.x===dc&&Math.abs(s.y-py)<.25))damage();
 render();exitCheck()}requestAnimationFrame(frame)}
function bind(id,fn){let b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();fn()})}
bind('left',()=>move(-1));bind('right',()=>move(1));bind('jump',jump);
document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'▶':'Ⅱ'};
document.getElementById('start').onclick=()=>{document.getElementById('cover').style.display='none';document.getElementById('game').style.display='block';startAudio();score=0;level=1;hp=3;resetLevel();running=true};
addEventListener('resize',()=>{if(running){size();render()}});requestAnimationFrame(frame);
</script></body></html>
