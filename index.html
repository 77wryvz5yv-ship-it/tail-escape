<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>꼬리탈출</title>
<style>*{box-sizing:border-box;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050812;color:white;font-family:-apple-system,sans-serif;touch-action:none}body{display:flex;justify-content:center;align-items:center}#w{width:min(96vw,520px);padding:10px}#top{display:flex;justify-content:space-between;align-items:end;margin-bottom:8px}#t{font-size:27px;font-weight:900;text-shadow:0 0 12px #0ef}#stats{text-align:right;color:#bff;font-weight:700}#box{position:relative;width:100%;aspect-ratio:1;border:2px solid #0ef;box-shadow:0 0 18px #0ef6;background:#07101b}canvas{width:100%;height:100%;display:block}#ov{position:absolute;inset:0;background:#02050ca8;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}#ov h1{font-size:38px;margin:0 0 8px;text-shadow:0 0 15px #0ef}#ov p{margin:4px;color:#d8fbff}button{margin-top:16px;padding:13px 25px;border-radius:13px;border:1px solid #0ef;background:#07313b;color:white;font-size:18px;font-weight:900}#pad{margin:12px auto 0;display:grid;grid-template-columns:62px 62px 62px;grid-template-rows:52px 52px;gap:6px;width:198px}.b{border:1px solid #0ef8;background:#0b1a2a;border-radius:12px;color:#bff;font-size:24px;display:flex;align-items:center;justify-content:center}#u{grid-column:2}#l{grid-column:1;grid-row:2}#d{grid-column:2;grid-row:2}#r{grid-column:3;grid-row:2}#tip{text-align:center;color:#8aa9b4;font-size:12px;margin-top:7px}</style></head>
<body><div id="w"><div id="top"><div id="t">꼬리탈출</div><div id="stats"><div id="sc">점수 0</div><div id="be">최고 0</div></div></div><div id="box"><canvas id="g" width="600" height="600"></canvas><div id="ov"><h1>꼬리탈출</h1><p>먹이를 먹으면 몸이 길어집니다.</p><p>벽과 자신의 몸을 피하세요.</p><p>10점마다 경기장이 좁아집니다!</p><button id="start">게임 시작</button></div></div><div id="pad"><div class="b" id="u">▲</div><div class="b" id="l">◀</div><div class="b" id="d">▼</div><div class="b" id="r">▶</div></div><div id="tip">스와이프 또는 방향 버튼으로 조작</div></div>
<script>
(function(){var c=document.getElementById('g'),x=c.getContext('2d'),ov=document.getElementById('ov'),sc=document.getElementById('sc'),be=document.getElementById('be'),N=24,z=25,s,f,q,n=0,b=0,m=0,run=false,timer=null,swx=0,swy=0;try{b=+localStorage.tebest||0}catch(e){}be.textContent='최고 '+b;
function free(a,d){if(a<m||d<m||a>=N-m||d>=N-m)return false;for(var i=0;i<s.length;i++)if(s[i].x==a&&s[i].y==d)return false;return true}
function food(){var a,d,k=0;do{a=m+Math.floor(Math.random()*(N-2*m));d=m+Math.floor(Math.random()*(N-2*m));k++}while(!free(a,d)&&k<1000);f={x:a,y:d}}
function reset(){m=0;n=0;s=[{x:11,y:12},{x:10,y:12},{x:9,y:12}];q={x:1,y:0};f=null;food();sc.textContent='점수 0';draw()}
function dir(a,d){if(!run||a==-q.x&&d==-q.y)return;q={x:a,y:d}}
function delay(){return Math.max(68,150-n*2.2)}function clock(){clearInterval(timer);timer=setInterval(step,delay())}
function step(){var h={x:s[0].x+q.x,y:s[0].y+q.y};if(h.x<m||h.y<m||h.x>=N-m||h.y>=N-m)return over();for(var i=0;i<s.length;i++)if(s[i].x==h.x&&s[i].y==h.y)return over();s.unshift(h);if(h.x==f.x&&h.y==f.y){n++;sc.textContent='점수 '+n;if(n>b){b=n;be.textContent='최고 '+b;try{localStorage.tebest=b}catch(e){}}if(n%10==0&&m<7)m++;food();clock()}else s.pop();draw()}
function begin(){clearInterval(timer);reset();run=true;ov.style.display='none';clock()}
function over(){run=false;clearInterval(timer);ov.style.display='flex';ov.innerHTML='<h1>게임 오버</h1><p>점수 <b>'+n+'</b> · 길이 <b>'+s.length+'</b></p><button id="again">다시 시작</button>';document.getElementById('again').onclick=begin}
function draw(){x.fillStyle='#07101b';x.fillRect(0,0,600,600);x.strokeStyle='#00eaff14';for(var i=0;i<=N;i++){x.beginPath();x.moveTo(i*z,0);x.lineTo(i*z,600);x.stroke();x.beginPath();x.moveTo(0,i*z);x.lineTo(600,i*z);x.stroke()}if(m){x.fillStyle='#ff285522';x.fillRect(0,0,600,m*z);x.fillRect(0,600-m*z,600,m*z);x.fillRect(0,m*z,m*z,600-2*m*z);x.fillRect(600-m*z,m*z,m*z,600-2*m*z);x.strokeStyle='#ff365f';x.lineWidth=4;x.strokeRect(m*z,m*z,600-2*m*z,600-2*m*z)}x.shadowBlur=20;x.shadowColor='#ff3b78';x.fillStyle='#ff3b78';x.beginPath();x.arc(f.x*z+12.5,f.y*z+12.5,7,0,7);x.fill();x.shadowBlur=0;for(var j=s.length-1;j>=0;j--){x.fillStyle=j?'#00d8b9':'#9affea';x.fillRect(s[j].x*z+3,s[j].y*z+3,19,19)}}
document.getElementById('start').onclick=begin;[['u',0,-1],['d',0,1],['l',-1,0],['r',1,0]].forEach(function(v){var e=document.getElementById(v[0]);function h(a){a.preventDefault();dir(v[1],v[2])}e.addEventListener('touchstart',h,{passive:false});e.addEventListener('mousedown',h)});
c.addEventListener('touchstart',function(e){swx=e.touches[0].clientX;swy=e.touches[0].clientY},{passive:true});c.addEventListener('touchend',function(e){var a=e.changedTouches[0].clientX-swx,d=e.changedTouches[0].clientY-swy;if(Math.max(Math.abs(a),Math.abs(d))<18)return;if(Math.abs(a)>Math.abs(d))dir(a>0?1:-1,0);else dir(0,d>0?1:-1)},{passive:true});reset()})();
</script></body></html>
